# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Configuración de resolución dinámica de controladores por tenant
    tenant.dynamic_resolution.excluded_controllers:
        - 'App\Controller\LoginController'
        - 'App\Controller\SecurityController'
        - 'App\Controller\LocaleController'
        - 'App\Controller\PasswordResetController'
    
    tenant.dynamic_resolution.excluded_namespaces:
        - 'Symfony\'
        - 'App\Controller\Mantenedores\'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Service\Revenue\Payment\Handler\PaymentMethodHandlerInterface:
            tags: ['app.revenue_payment_handler']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Servicios específicos del tenant

    App\Service\TenantResolver:
        arguments:
            $centralDbUrl: '%env(DATABASE_URL)%'

    App\Service\TenantContext:
        arguments:
            $centralDbUrl: '%env(DATABASE_URL)%'

    # CustomTenantConfigProvider: Integración con hakam/multi-tenancy-bundle
    # Usa TenantResolver para leer desde tenant_central
    App\Service\CustomTenantConfigProvider: ~

    # Alias para que el bundle use nuestro provider personalizado
    Hakam\MultiTenancyBundle\Port\TenantConfigProviderInterface:
        alias: App\Service\CustomTenantConfigProvider
        public: true

    # Extensiones Twig
    App\Twig\LocalizationExtension:
        tags: ['twig.extension']

    # MenuBuilder Service - Construye el menú de navegación
    App\Service\Menu\MenuBuilder:
        arguments:
            $requestStack: '@request_stack'
            $menuDefinition: '@App\Service\Menu\MenuDefinition'

    # MenuExtension - Hace menu_items disponible globalmente en Twig
    App\Twig\MenuExtension:
        arguments:
            $menuBuilder: '@App\Service\Menu\MenuBuilder'
        tags: ['twig.extension']

    App\Service\Revenue\Payment\PaymentBatchProcessor:
        arguments:
            $handlers: !tagged_iterator app.revenue_payment_handler

    # DTE/Aces: argumentos escalares no autowireables
    App\Service\Revenue\Dte\AcesClient:
        arguments:
            $wsUrl:     '%env(ACES_WS_URL)%'
            $user:      '%env(ACES_USER)%'
            $password:  '%env(ACES_PASSWORD)%'
            $apiKey:    '%env(ACES_API_KEY)%'
            $idEmpresa: '%env(ACES_ID_EMPRESA)%'
            $preview:   '%env(bool:ACES_PREVIEW)%'

    # BonoWeb/Snabb: argumentos escalares no autowireables
    App\Service\Revenue\BonoWeb\BonoWebClient:
        arguments:
            $apiUrl:  '%env(BONOWEB_API_URL)%'
            $apiKey:  '%env(BONOWEB_API_KEY)%'
            $timeout: '%env(int:BONOWEB_TIMEOUT)%'

    # Event Listeners
    App\EventListener\LocaleListener:
        tags:
            - { name: kernel.event_subscriber }

    App\EventListener\TenantTranslationListener:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: kernel.event_subscriber }

    # TenantDatabaseSwitchListener: Usa SwitchDbEvent del bundle
    # Reemplaza al antiguo TenantConnectionListener (eliminado)
    App\EventListener\TenantDatabaseSwitchListener: ~

    #App\EventListener\AuthenticationListener:
    #    arguments:
    #        $urlGenerator: '@router'
    #    tags:
    #        - { name: kernel.event_subscriber }

    # Event Subscribers
    App\EventSubscriber\DynamicControllerSubscriber:
        arguments:
            $excludedControllers: '%tenant.dynamic_resolution.excluded_controllers%'
            $excludedNamespaces: '%tenant.dynamic_resolution.excluded_namespaces%'
        tags:
            - { name: kernel.event_subscriber }
