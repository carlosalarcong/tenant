framework:
    default_locale: es
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - es
            - en
        # Habilitar caché de traducciones
        cache_dir: '%kernel.cache_dir%/translations'
        # Paths adicionales para buscar traducciones por tenant
        paths:
            - '%kernel.project_dir%/translations'
            - '%kernel.project_dir%/translations/default'
            - '%kernel.project_dir%/translations/hospital'
            - '%kernel.project_dir%/translations/lacolina'
        providers:
